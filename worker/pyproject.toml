[project]
name = "worker"
version = "0.1.0"
description = "Encargado de scrapear las web que el producer indica"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "bs4>=0.0.2",
    "curl-cffi>=0.15.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.0",
    "shared",
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "moto[server,sqs]",
    "flask>=3.1.3",
]
