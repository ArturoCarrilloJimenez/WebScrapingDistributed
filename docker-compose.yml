services:
  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NUM_MAX_TASKS=${NUM_MAX_TASKS}
      - PRODUCER_PORT=${PRODUCER_PORT}
      - DEFAULT_REGION_AWS=${DEFAULT_REGION_AWS}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - "./producer:/app"
      - "./shared:/app/shared"
    depends_on:
      - emulator-aws

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    volumes:
      - "./worker:/app"
      - "./shared:/app/shared"
    depends_on:
      - emulator-aws
      - producer

  emulator-aws:
    image: floci/floci:latest-compat # <--- Añade el sufijo "-compat"
    ports:
      - "4566:4566"
    environment:
      - DEFAULT_REGION=${DEFAULT_REGION_AWS}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - FLOCI_STORAGE_MODE=hybrid
    volumes:
      - "./infra/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - localstack_data:/app/data

volumes:
  localstack_data:
