sonar.projectKey=ArturoCarrilloJimenez_WebScrapingDistributed
sonar.organization=arturocarrillojimenez
sonar.projectName=WebScrapingDistributed
sonar.projectVersion=1.0

sonar.sources=producer,worker,shared,jobs
sonar.tests=producer/test,worker/test,jobs/test

# Analizamos todo el repositorio
sonar.language=py
sonar.sources=.
sonar.python.version=3.13

# Excluir de análisis estático
sonar.exclusions=**/test/**,**/.venv/**,**/__pycache__/**,**/*.md,**/.github/**,**/uv.lock

# Exclusión de Security Hotspot S6258 (Log bucket infinite loop target)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.e1.resourceKey=infra/terraform/main.tf

# Configuración de cobertura y pruebas
sonar.python.coverage.reportPaths=producer/coverage.xml,worker/coverage.xml,jobs/coverage.xml
sonar.python.xunit.reportPath=producer/test-results.xml,worker/test-results.xml,jobs/test-results.xml

# Encoding
sonar.sourceEncoding=UTF-8

sonar.qualitygate.wait=true
