[project]
name = "ScrapingDistributed"
version = "0.1.0"
description = "Distributed web scraping application with producer-consumer architecture"
readme = "README.md"
requires-python = ">=3.13"

[tool.uv.sources]
shared = { workspace = true }

[tool.uv.workspace]
members = [
    "shared",
    "producer",
    "worker",
    "jobs",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "moto[sqs,s3]>=5.0.0",
]
