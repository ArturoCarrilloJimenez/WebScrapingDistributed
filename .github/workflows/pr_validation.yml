name: PR Validation & SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  test-and-analyze:
    name: Test and SonarCloud Analysis
    runs-on: ubuntu-latest
    
    env:
      DEFAULT_REGION_AWS: us-east-1
      AWS_ACCESS_KEY_ID: testing 
      AWS_SECRET_ACCESS_KEY: testing
      SQS_ENDPOINT_URL: "http://localhost:4566"
      SQS_QUEUE_URL: "http://localhost:4566/000000000000/test-queue"
      NUM_MAX_TASKS: 10
      PRODUCER_PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies and run tests for Producer
        working-directory: ./producer
        run: |
          uv sync --dev
          uv run pytest test/ --cov=./ --cov-report=xml --junitxml=test-results.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          